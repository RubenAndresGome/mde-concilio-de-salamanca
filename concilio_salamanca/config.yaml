# Configuración del Concilio de Salamanca (MDE)
concilio:
  # Proveedor LLM: openai, deepseek, anthropic, groq, ollama, opencode, openrouter
  provider: "deepseek"
  # Modelo LLM principal
  model: "deepseek-v4-flash"
  # URL base opcional (para proxies, self-hosted o DeepSeek)
  base_url: ""
  # Temperatura para razonamiento silogistico (0 = determinista)
  temperature: 0
  # API key (usa variable de entorno OPENAI_API_KEY si no se especifica)
  # api_key: "sk-..."

debate:
  # Número de rondas de refutación cruzada
  max_rounds: 2
  # Habilitar validación del Principio de No Contradicción
  enable_pnc: true
  # Ejecutar agentes en paralelo (requiere LangGraph con soporte Send)
  parallel: false
  # Agentes participantes (claves separadas por comas o nombre de grupo)
  # Opciones: promotor, defensor, doctor, larouche, leon_xiii,
  #           linus, wozniak, stallman, stroustrup, thompson, korotkevich
  #           ockham, arquimedes, custos_impacti, magister_processus,
  #           magister_delineationis, redteam, pentest, abuser, causas, leibniz, nietzsche
  # Grupos: escolasticos, pragmaticos, eticos, algoritmicos, acusacion, defensa,
  #         tecnicos, clean_code, logici, delineatio, red_team, proceso, todos
  agents: ["promotor", "defensor", "doctor", "larouche", "leon_xiii"]

compute:
  interactive_policy: "ask"
  non_interactive_policy: "auto"
  default_priority: "cost"
  cost_model: "deepseek-v4-flash"
  quality_model: "deepseek-v4-pro"
  cost_thinking: "disabled"
  quality_thinking: "enabled"
  fallback_ollama: ["deepseek-v4", "deepseek-r1", "deepseek-coder", "qwen3-coder", "qwen2.5-coder"]

audit_levels:
  0: {name: "estatico", agents: 0, rounds: 0, calls: 0, agent_tokens: 0, magister_tokens: 0}
  1: {name: "economico", agents: 2, rounds: 1, calls: 2, agent_tokens: 384, magister_tokens: 0}
  2: {name: "normal", agents: 3, rounds: 2, calls: 6, agent_tokens: 512, magister_tokens: 768}
  3: {name: "pleno", agents: 5, rounds: 2, calls: 11, agent_tokens: 768, magister_tokens: 1200}

frontier:
  require_approval: true
  catalogue_updated_at: "2026-08-02"
  stale_after_days: 30
  candidates: ["gpt-5.6-terra", "gpt-5.6-sol"]

output:
  # Directorio para guardar veredictos
  save_dir: "./veredictos"
  # Formato de salida: json, text, markdown
  format: "json"

# Configuración de pesos multi-modelo (Compatibilidad Muchos LLM)
# Define qué modelos se usan y con qué prioridad.
# El modelo con peso más alto será el default.
# Los pesos son relativos; puedes usar 0 para deshabilitar un modelo.
# Usa "auto" en roles para que ModelRanker decida calidad-precio-disponibilidad.
model_weights:
  ollama: 1
  meta-llama: 2
  deepseek: 10
  qwen: 1
  minimax: 1
  bytedance-seed: 1
  openai: 0
  anthropic: 0

# Roles: ejecutor (obreros baratos, tasks simples) y
#        director_strategy (magister deluxe, razonamiento profundo)
# Usa "auto" para seleccion automatica via ModelRanker
roles:
  ejecutor: "auto"
  director_strategy: "auto"

# Límite de costo por debate (opcional, en USD)
budget:
  max_per_debate_usd: 0.50
  warn_at_usd: 0.10
  default_token_budget: 0

licencia:
  developer_name: ""
  project_name: ""
  github_repo: ""
  default_country: "US"
