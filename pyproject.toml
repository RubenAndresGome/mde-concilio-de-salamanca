[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "concilio-salamanca"
version = "1.0.0"
description = "MDE Skill — Auditoria de Codigo por Meta Dialectica Escolastica"
readme = "concilio_salamanca/README.md"
license = {text = "RERUM NOVARUM STATUTO (RNS) v4.1"}
requires-python = ">=3.11"
keywords = ["code-review", "audit", "llm", "ai-agents", "scholastic", "dialectics"]
authors = [
    {name = "MDE Skill Contributors"},
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Code Generators",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "z3-solver>=4.12.2",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic"]
groq = ["langchain-groq"]
ollama = ["langchain-ollama"]
openrouter = []             # No extra SDK needed; uses langchain-openai
all = ["langchain-anthropic", "langchain-groq", "langchain-ollama"]
dev = ["pytest>=7.0", "pytest-asyncio", "ruff"]

[project.urls]
Homepage = "https://opencode.ai"
Repository = "https://github.com/anomalyco/opencode"
Documentation = "https://opencode.ai"

[project.scripts]
concilio = "concilio_salamanca.main:main"

[tool.setuptools.packages.find]
include = ["concilio_salamanca*"]

[tool.pytest.ini_options]
testpaths = ["concilio_salamanca/tests"]
python_files = ["test_*.py"]
